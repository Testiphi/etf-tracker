# ============================================
# 大盘指数跟踪（基准对比）
# ============================================
indices:
  - code: "000688"
    name: "上证科创50"
    market: "cn_index"
  - code: "000510"
    name: "中证A500"
    market: "cn_index"
  - code: "^GSPC"
    name: "标普500"
    market: "us_index"
  - code: "^NDX"
    name: "纳斯达克100"
    market: "us_index"
  - code: "^HSTECH"
    name: "恒生科技"
    market: "hk_index"
  - code: "XAU"
    name: "国际金价"
    market: "cn_gold"

# 商品行情（已并入大盘 indices）
commodities: []

# AI 分析
ai_analysis:
  enabled: true
  provider: "deepseek"
  api_key_env: "AI_API_KEY"
  prompt: >
    请根据以上市场数据，按以下框架输出今日基金日报分析（使用 Markdown 标题）：

    ## 1. 基金今日净值整体表现
    按风格分类（A股成长/宽基指数/美股QDII/黄金/债券）总结今日涨跌，
    说明领涨领跌基金及可能原因（如板块强势、汇率、指数联动等）。

    ## 2. 大盘指数表现与成交量
    逐个分析以下指数今日涨跌：科创50、中证A500、标普500、纳斯达克100、恒生科技、
    国际金价。每个指数给出收盘价、涨跌幅、成交量，并解读成交量是否异常
    （放量上涨/缩量调整/放量下跌等），对比A股/美股/港股/黄金之间的联动关系。

    ## 3. 黄金行情与避险情绪
    国际金价今日走势、对避险情绪的提示，以及与黄金相关基金的表现印证。

    ## 4. 短期趋势判断（1-2周维度）与调仓建议
    结合大盘走势、成交量和基金风格给出趋势判断，以及具体的调仓/持有建议。

    ## 5. 风险提示
    如有风险数据，结合最大回撤和波动率评估当前组合风险水平，给出风控建议。

    要求：语言简洁客观，数据准确，每条分析给出具体数字依据。

# 交叉验证设置
validation:
  min_sources: 2
  max_retries: 3
  retry_cooldown: 10

# 邮件设置
email:
  smtp_server: "smtp.office365.com"
  smtp_port: 587
  use_tls: true
  from_env: "OUTLOOK_EMAIL"
  password_env: "OUTLOOK_PASSWORD"
  to: ""
  subject_prefix: "[基金日报]"
